openapi: 3.0.3
info:
  title: QMS QR Service
  version: 1.0.0
  description: |
    Microservice QR untuk QMS: pembuat/verifikator token join dan perender PNG QR.
    Service ini stateless dan satu-satunya pemegang JOIN_LINK_SECRET.
servers:
  - url: http://localhost:8090
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Service hidup
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Service siap melayani
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
  /internal/v1/join-token:
    post:
      summary: Buat token join
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [queue_id, type]
              properties:
                queue_id:
                  type: integer
                  minimum: 1
                type:
                  type: string
                  enum: [static, dynamic]
                ttl_seconds:
                  type: integer
                  minimum: 30
                  maximum: 600
                  description: Hanya dipakai untuk token dinamis.
      responses:
        '200':
          description: Token dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /internal/v1/join-token/verify:
    post:
      summary: Verifikasi token join
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema:
                type: object
                required: [valid, queue_id, type]
                properties:
                  valid:
                    type: boolean
                    example: true
                  queue_id:
                    type: integer
                  type:
                    type: string
                    enum: [static, dynamic]
                  expires_at:
                    type: integer
                    nullable: true
        '400':
          $ref: '#/components/responses/BadToken'
        '401':
          $ref: '#/components/responses/InvalidToken'
        '410':
          $ref: '#/components/responses/ExpiredToken'
  /internal/v1/qr/render:
    post:
      summary: Render QR generik untuk kebutuhan internal
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data]
              properties:
                data:
                  type: string
                  maxLength: 1024
                size:
                  type: integer
                  default: 512
                level:
                  type: string
                  enum: [L, M, Q, H]
                fg:
                  type: string
                bg:
                  type: string
      responses:
        '200':
          description: PNG QR
          content:
            image/png:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
components:
  securitySchemes:
    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
  schemas:
    Token:
      type: object
      required: [token, type]
      properties:
        token:
          type: string
        type:
          type: string
          enum: [static, dynamic]
        expires_at:
          type: integer
          nullable: true
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
  responses:
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadToken:
      description: Token rusak atau format tidak dikenal
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InvalidToken:
      description: Tanda tangan token salah
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ExpiredToken:
      description: Token dinamis kedaluwarsa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: X-Service-Token salah atau kosong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
