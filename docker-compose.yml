# Stack QMS: db + qr-service + backend + frontend (build) + nginx.
#
#   cp .env.example .env   # isi secret + origin publik
#   docker compose up --build
#
# Hanya nginx yang membuka port ke host. qr-service tidak punya `ports:` sehingga
# endpoint /internal/v1/* hanya bisa diakses dari jaringan Docker.
name: qms

services:
  db:
    build: ./db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-qms_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  qr-service:
    build: ./qr-service
    environment:
      PORT: "8090"
      PUBLIC_APP_URL: ${QMS_PUBLIC_ORIGIN:?set QMS_PUBLIC_ORIGIN in .env}
      JOIN_LINK_SECRET: ${JOIN_LINK_SECRET:?set JOIN_LINK_SECRET in .env}
      QR_DYNAMIC_TTL_SECONDS: ${QR_DYNAMIC_TTL_SECONDS:-120}
      QR_SERVICE_TOKEN: ${QR_SERVICE_TOKEN:?set QR_SERVICE_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Tanpa ports: hanya di jaringan internal. Healthcheck ada di Dockerfile.
    networks:
      - internal
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-qms_db}?sslmode=disable
      PORT: "8080"
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      ALLOWED_ORIGINS: ${QMS_PUBLIC_ORIGIN:?set QMS_PUBLIC_ORIGIN in .env}
      PUBLIC_APP_URL: ${QMS_PUBLIC_ORIGIN}
      PUBLIC_QR_URL: ${QMS_PUBLIC_ORIGIN}
      QR_SERVICE_URL: http://qr-service:8090
      QR_SERVICE_TOKEN: ${QR_SERVICE_TOKEN:?set QR_SERVICE_TOKEN in .env}
      QR_HTTP_TIMEOUT: ${QR_HTTP_TIMEOUT:-1}
    depends_on:
      db:
        condition: service_healthy
      qr-service:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # Image build-only: menyalin hasil `expo export` ke volume yang dibaca nginx.
  frontend:
    build:
      context: ./frontend
      args:
        EXPO_PUBLIC_API_URL: ${QMS_PUBLIC_ORIGIN:?set QMS_PUBLIC_ORIGIN in .env}
    volumes:
      - frontend_dist:/target
    command: ["sh", "-c", "rm -rf /target/* && cp -r /dist/. /target/"]
    restart: "no"
    networks:
      - internal

  nginx:
    build: ./deploy/nginx
    environment:
      QMS_DOMAIN: ${QMS_DOMAIN:-localhost}
      BACKEND_HOST: backend
      QR_SERVICE_HOST: qr-service
      FRONTEND_ROOT: /srv/qms-frontend
    volumes:
      - frontend_dist:/srv/qms-frontend:ro
    ports:
      - "${QMS_HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
      qr-service:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    networks:
      - internal
    restart: unless-stopped

volumes:
  db_data:
  frontend_dist:

networks:
  internal:
    driver: bridge
