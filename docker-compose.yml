# =============================================================================
# docker-compose.yml: stack QMS untuk DEVELOPMENT.
# -----------------------------------------------------------------------------
# Dipakai oleh  : developer di laptop (make up, make tunnel, make down, make seed).
# Dijalankan    : `docker compose up --build` atau `make up` (alamat LAN) /
#                 `make tunnel` (HTTPS publik lewat Cloudflare quick tunnel).
# Tidak dipakai : docker-compose.prod.yml (stack demo/produksi). Jangan dijalankan
#                 bersamaan: port 8080 akan bentrok.
#
# Service (port internal kontainer; hanya nginx yang membuka port ke host):
#   nginx          :80    -> host ${QMS_HTTP_PORT:-8080}  (satu-satunya pintu masuk)
#   frontend       Metro  (hot reload, tidak dibuka ke host)
#   backend        :8080  API Go (go run, kode di-mount)
#   qr-service     :8090  token join QR (HMAC), hanya jaringan internal
#   notify-service :8091  Web Push (LISTEN Postgres)
#   mail-service   :8092  pengirim email (outbox + SMTP), hanya jaringan internal
#   payment-service:8093  perpanjangan langganan lewat Stripe / simulator dev
#   db             :5432  PostgreSQL 16, tidak dipetakan ke host
#   mailpit        :1025 (SMTP), :8025 (UI), hanya di 127.0.0.1 host
#
# Konfigurasi lewat environment saat run (sumber: .env dari .env.example),
# TIDAK dibakar ke image. Variabel wajib ditandai ${VAR:?...} dan membuat
# `compose up` gagal bila kosong.
#
#   cp .env.example .env     # isi secret
#   docker compose up --build
#   -> http://localhost:${QMS_HTTP_PORT:-8080}   (/ frontend, /api backend, /qr qr-service)
#
# Saat ada perubahan, periksa:
#   [SINKRON] Subnet 172.28.0.0/16 (networks.internal) harus sama dengan
#             TRUSTED_PROXIES backend. Bila subnet diubah, ubah keduanya.
#   [SINKRON] Port internal (8090/8091/8092/8093/8080) harus sama dengan PORT di
#             environment service dan dengan upstream di deploy/nginx/server.conf.
#   [SINKRON] MAILPIT_UI_PORT dibaca Makefile (target up, tunnel, mailpit) untuk
#             menampilkan link Mailpit. Ubah di .env, bukan di Makefile.
#   [PENTING] stop_grace_period (3s) harus lebih besar dari SHUTDOWN_TIMEOUT
#             backend. Go `run` tidak selalu meneruskan SIGTERM ke proses anak.
#   [PENTING] Volume dev (db_data, metro_cache, ...) berbeda dengan prod (db_data_prod).
#             Mengganti nama volume membuat data lama tidak terpakai.
#
# Kode di-mount. Frontend hot reload (Metro). Go (backend, qr-service) memakai `go run`: setelah ubah kode,
#   docker compose restart backend      # atau qr-service; cache build di volume, jadi hanya beberapa detik
# HTTPS untuk uji dari HP: make tunnel (Cloudflare quick tunnel).
# Akses db/psql lewat kontainer:
#   docker compose exec db psql -U qms -d qms_db
#   docker compose exec -T db psql -U qms -d qms_db < db/scripts/reset_seed_dev.sql
# Build produksi: gunakan `target: prod` pada Dockerfile masing-masing service.
# =============================================================================

name: qms

services:
  # PostgreSQL 16. Skema dibuat otomatis dari db/migrations/*.sql saat volume db_data
  # masih kosong (lihat db/Dockerfile). Role per service dibuat oleh 03/04/05_*.sh.
  db:
    build: ./db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-qms_db}
      # Password role per service. Dibaca oleh skrip init (db/migrations/03..05_*.sh).
      NOTIFY_DB_PASSWORD: ${NOTIFY_DB_PASSWORD:?set NOTIFY_DB_PASSWORD in .env}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD:?set MAIL_DB_PASSWORD in .env}
      # Kosong = role payment_rw tidak dibuat (db/migrations/05_payment_role.sh): hanya payment-service yang belum bisa
      # terhubung, database dan antrian tetap start.
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-}
    volumes:
      # Data database. Bertahan saat container dibuat ulang. Hapus volume untuk memulai dari nol.
      - db_data:/var/lib/postgresql/data
    # pg_isready: container dianggap siap setelah database menerima koneksi. Service lain menunggu
    # kondisi service_healthy ini lewat depends_on.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Hanya jaringan internal. Port 5432 tidak dipetakan ke host.
    networks:
      - internal

  # qr-service: membuat dan memverifikasi token join QR. Hanya dipanggil backend lewat jaringan internal.
  qr-service:
    build:
      context: ./qr-service
      # target dev: go run dari kode yang di-mount, tanpa binary hasil build.
      target: dev
    environment:
      PORT: "8090"
      JOIN_LINK_SECRET: ${JOIN_LINK_SECRET:?set JOIN_LINK_SECRET in .env}
      QR_DYNAMIC_TTL_SECONDS: ${QR_DYNAMIC_TTL_SECONDS:-120}
      QR_SERVICE_TOKEN: ${QR_SERVICE_TOKEN:?set QR_SERVICE_TOKEN in .env}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Kode sumber (hot edit via restart). Cache build dan modul Go di volume bersama.
      - ./qr-service:/src
      - go_build_cache:/root/.cache/go-build
      - go_mod_cache:/go/pkg/mod
    # `go run` tidak selalu meneruskan SIGTERM ke proses anak; jangan tunggu 10 detik.
    stop_grace_period: 3s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8090/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
    networks:
      - internal
    restart: unless-stopped

  # notify-service: Web Push. Mendengarkan event tiket lewat LISTEN Postgres dengan role notify_ro (baca saja).
  # Tidak bergantung pada mail-service, Mailpit, atau SMTP (dijaga scripts/check-service-isolation.sh).
  notify-service:
    build:
      context: ./notify-service
      target: dev
    environment:
      DATABASE_URL: postgresql://notify_ro:${NOTIFY_DB_PASSWORD}@db:5432/${POSTGRES_DB:-qms_db}?sslmode=disable
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:?set VAPID_PUBLIC_KEY in .env}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:?set VAPID_PRIVATE_KEY in .env}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
    volumes:
      - ./notify-service:/src
      - go_build_cache:/root/.cache/go-build
      - go_mod_cache:/go/pkg/mod
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8091/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    stop_grace_period: 3s
    # Menunggu database siap karena harus LISTEN ke Postgres sejak start.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # mail-service: satu-satunya pengirim email (SMTP, templat, coba ulang). Menjalankan worker outbox (membaca
  # notification_outbox lewat role mail_rw) dan API POST /internal/v1/send (X-Service-Token). Hanya di jaringan
  # internal (tidak ada rute nginx). notify-service tidak mengirim email dan tidak bergantung padanya.
  mail-service:
    build:
      context: ./mail-service
      target: dev
    environment:
      PORT: "8092"
      MAIL_SERVICE_TOKEN: ${MAIL_SERVICE_TOKEN:?set MAIL_SERVICE_TOKEN in .env}
      # Dev: semua email ditangkap Mailpit, tidak ada yang keluar ke internet.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-Antrian <no-reply@qms.local>}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-none}
      # Worker outbox (email ke pemilik tiket). Role mail_rw: baca outbox dan email pengguna, tanpa hak lain.
      DATABASE_URL: postgresql://mail_rw:${MAIL_DB_PASSWORD}@db:5432/${POSTGRES_DB:-qms_db}?sslmode=disable
      QMS_PUBLIC_ORIGIN: ${QMS_PUBLIC_ORIGIN:-http://localhost:8080}
    volumes:
      - ./mail-service:/src
      - go_build_cache:/root/.cache/go-build
      - go_mod_cache:/go/pkg/mod
    stop_grace_period: 3s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8092/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
    # Hanya menunggu db agar worker bisa menyambung. Mailpit tidak disyaratkan: bila SMTP mati, email menunggu
    # di outbox dan dicoba ulang, tidak hilang.
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # payment-service: memperpanjang langganan owner 1 bulan setelah pembayaran Stripe. TERPISAH dari antrian:
  # backend hanya membaca owners.subscription_expires_at dan tidak memanggil service ini, jadi tidak ada depends_on
  # dari/ke backend. Bila ini mati, antrian tetap jalan; hanya perpanjangan yang tertunda (Stripe mengirim ulang
  # webhook). Role payment_rw hanya menyentuh kolom langganan dan tabel pembayaran. Tanpa kunci Stripe, service tetap
  # hidup dan checkout menjawab 503. Dev: DEV_PAYMENT_SIMULATOR=true (pembayaran palsu, tanpa kunci), atau kunci mode
  # uji Stripe (sk_test_..., tanpa uang sungguhan).
  payment-service:
    build:
      context: ./payment-service
      target: dev
    environment:
      PORT: "8093"
      DATABASE_URL: postgresql://payment_rw:${PAYMENT_DB_PASSWORD:-unset}@db:5432/${POSTGRES_DB:-qms_db}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # APP_ENV kosong di dev. Bila diisi `production`, service menolak start bersama DEV_PAYMENT_SIMULATOR.
      APP_ENV: ${APP_ENV:-}
      # Origin publik aplikasi; dipakai untuk URL kembali dari checkout Stripe.
      QMS_PUBLIC_ORIGIN: ${QMS_PUBLIC_ORIGIN:-http://localhost:8080}
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_API_BASE_URL: ${STRIPE_API_BASE_URL:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      SUBSCRIPTION_PRICE_AMOUNT: ${SUBSCRIPTION_PRICE_AMOUNT:-50000}
      SUBSCRIPTION_CURRENCY: ${SUBSCRIPTION_CURRENCY:-idr}
      # HANYA DEV: pembayaran palsu tanpa Stripe (tombol bayar langsung berhasil). Tidak ada di docker-compose.prod.yml,
      # dan service menolak start bila ini menyala bersama APP_ENV=production atau kunci Stripe.
      DEV_PAYMENT_SIMULATOR: ${DEV_PAYMENT_SIMULATOR:-}
    volumes:
      - ./payment-service:/src
      - go_build_cache:/root/.cache/go-build
      - go_mod_cache:/go/pkg/mod
    stop_grace_period: 3s
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8093/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # Mailpit: server SMTP palsu untuk development. Menangkap semua email dari notify-service dan menampilkannya
  # di UI web. Di host, SMTP (1025) dan UI (8025) hanya diikat ke 127.0.0.1 dan TIDAK lewat nginx, jadi tidak
  # terjangkau dari luar mesin ini; notify-service memakai mailpit:1025 lewat jaringan internal.
  # Port 1025 adalah bawaan umum Mailpit: bila proyek lain di mesin ini juga memakainya, ubah MAILPIT_SMTP_PORT. Pesan hilang saat container dibuat ulang (tanpa volume, disengaja).
  # Produksi memakai SMTP nyata dan tidak punya service ini (docker-compose.prod.yml).
  mailpit:
    image: axllent/mailpit:v1.31.6
    environment:
      MP_MAX_MESSAGES: "500"
    # Dipetakan hanya ke 127.0.0.1 host. Tidak bisa diakses dari LAN atau tunnel.
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal
    restart: unless-stopped

  # backend: API utama (Gin). Mengelola auth, antrian, tiket, SSE, dan memanggil qr-service serta mail-service.
  backend:
    build:
      context: ./backend
      target: dev
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-qms}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-qms_db}?sslmode=disable
      PORT: "8080"
      APP_ENV: ${APP_ENV:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      # Origin yang boleh memanggil API (CORS) dan dipakai untuk membuat tautan di email.
      ALLOWED_ORIGINS: ${QMS_PUBLIC_ORIGIN:-http://localhost:8080}
      PUBLIC_APP_URL: ${QMS_PUBLIC_ORIGIN:-http://localhost:8080}
      # Hanya nginx di jaringan internal yang boleh menentukan IP klien (X-Forwarded-For).
      # [SINKRON] Harus sama dengan subnet networks.internal di bawah.
      TRUSTED_PROXIES: 172.28.0.0/16
      QR_SERVICE_URL: http://qr-service:8090
      QR_SERVICE_TOKEN: ${QR_SERVICE_TOKEN:?set QR_SERVICE_TOKEN in .env}
      QR_HTTP_TIMEOUT: ${QR_HTTP_TIMEOUT:-1}
      # Batas menunggu request selesai saat berhenti; harus lebih kecil dari stop_grace_period di bawah.
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-2}
      # Verifikasi email: kosong = nyala bila mail-service terpasang (selalu, di compose ini). `false` mematikan.
      # Email verifikasi masuk ke Mailpit di dev.
      EMAIL_VERIFICATION_REQUIRED: ${EMAIL_VERIFICATION_REQUIRED:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      # Lupa/reset password: backend memanggil mail-service (jaringan internal). Email yang macet tidak boleh
      # menahan backend, jadi tidak ada depends_on.
      MAIL_SERVICE_URL: http://mail-service:8092
      MAIL_SERVICE_TOKEN: ${MAIL_SERVICE_TOKEN:?set MAIL_SERVICE_TOKEN in .env}
    volumes:
      - ./backend:/src
      - go_build_cache:/root/.cache/go-build
      - go_mod_cache:/go/pkg/mod
    # `go run` tidak selalu meneruskan SIGTERM ke proses anak; jangan tunggu 10 detik.
    stop_grace_period: 3s
    # /health dipakai nginx (depends_on service_healthy) sebelum menerima trafik.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
    depends_on:
      db:
        condition: service_healthy
      qr-service:
        condition: service_healthy
    networks:
      - internal
    restart: unless-stopped

  # frontend: aplikasi Expo (Metro dev server) untuk web. Tidak dipetakan ke host; diakses lewat nginx.
  frontend:
    build:
      context: ./frontend
      target: dev
    environment:
      # Web di belakang nginx memanggil API di origin yang sama.
      EXPO_PUBLIC_API_URL: origin
    volumes:
      # Kode frontend (hot reload Metro).
      - ./frontend:/app
      # Jaga node_modules dari image (jangan tertimpa folder host).
      - /app/node_modules
      # Cache Metro bertahan saat container dibuat ulang (make up memakai --force-recreate).
      - metro_cache:/tmp/metro-cache
    networks:
      - internal
    restart: unless-stopped

  # nginx: satu-satunya pintu masuk. Meneruskan / ke frontend, /api ke backend, dan /qr ke qr-service,
  # serta menerapkan rate limit. Konfigurasi ada di deploy/nginx/.
  nginx:
    build: ./deploy/nginx
    # Dipetakan ke semua antarmuka host (LAN bisa mengakses). Port bisa diubah lewat QMS_HTTP_PORT.
    ports:
      - "${QMS_HTTP_PORT:-8080}:80"
    # Menunggu backend dan qr-service sehat sebelum menerima trafik. Frontend cukup sudah start.
    depends_on:
      backend:
        condition: service_healthy
      qr-service:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - internal
    restart: unless-stopped

# Volume bernama. Data bertahan saat container dibuat ulang; hapus dengan `docker compose down -v`.
volumes:
  # Data PostgreSQL (dev).
  db_data:
  # Cache build Go (go-build) dan modul Go (/go/pkg/mod) untuk backend, qr-service, notify-service, mail-service,
  # payment-service. Mempercepat `go run` setelah restart.
  go_build_cache:
  go_mod_cache:
  # Cache Metro untuk frontend.
  metro_cache:

# Jaringan internal bersama. Hanya nginx yang membuka port ke host.
networks:
  internal:
    driver: bridge
    # Subnet tetap, dipakai backend sebagai TRUSTED_PROXIES (membaca X-Forwarded-For hanya dari sini).
    # nginx dev tidak memakai subnet ini; nginx prod memakai 172.29.0.0/16 di nginx.prod.conf.
    # [SINKRON] Ubah hanya bersama TRUSTED_PROXIES di service backend.
    ipam:
      config:
        - subnet: 172.28.0.0/16
