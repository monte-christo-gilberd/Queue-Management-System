# =============================================================================
# rules.yaml: aturan alert Grafana sebagai kode (Fase 5). DIHASILKAN dari daftar aturan, jangan diubah sembarangan
# tanpa memeriksa ambangnya di plan (docs/plan-observability-tracing.md, bagian Fase 5).
# -----------------------------------------------------------------------------
# Perilaku : aturan dievaluasi tiap 1 menit dan statusnya terlihat di Grafana (Alerting > Alert rules). Notifikasi
#            BELUM dikirim ke mana pun: policy di policies.yaml menahan semua notifikasi dengan jadwal senyap
#            "selalu-senyap" (mutetimings.yaml). Pengiriman (email/Slack) menyusul di luar cakupan.
# Struktur : tiap aturan punya tiga langkah: A = query (Prometheus atau Loki), B = ambil nilai terakhir (reduce),
#            C = bandingkan dengan ambang (threshold). `for` = lama kondisi harus bertahan sebelum berstatus Firing.
# Tanpa data (noDataState OK): bila query kosong (mis. tidak ada galat 5xx sama sekali), aturan dianggap Normal.
#            Pengecualian: "Service mati" memakai NoData agar hilangnya target terlihat.
# Ambang    : sebagian adalah tebakan awal untuk skala demo; disetel ulang setelah ada data nyata (lihat catatan tiap aturan).
# =============================================================================
apiVersion: 1

groups:

  # ---- Grup: Ketersediaan ----
  - orgId: 1
    name: qms-ketersediaan
    # folder Grafana tempat aturan ini muncul
    folder: QMS Alert
    # interval evaluasi semua aturan di grup ini
    interval: 1m
    rules:

      # Service mati. up bernilai 1 bila scrape berhasil. Ambang: kurang dari 1 selama 2 menit.
      - uid: qms-service-down
        title: Service mati
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "min by (service) (up{job=\"qms-services\"})"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih kecil dari 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [1]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: NoData
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 2m
        annotations:
          summary: "Service {{ $labels.service }} tidak bisa di-scrape"
          description: "Prometheus gagal mengambil /metrics dari {{ $labels.service }} selama 2 menit: service mati atau tidak terjangkau. Antrian bisa terganggu (backend, qr-service) atau fitur terkait mati (auth: login baru, mail: email, notify: push)."
        labels:
          severity: critical
          system: qms

      # Container start ulang berulang. Mencakup semua container di host, bukan hanya QMS. Id container, bukan nama, karena cAdvisor berjalan tanpa docker.sock.
      - uid: qms-container-restart
        title: Container start ulang berulang
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "max by (container_id) (changes(container_start_time_seconds{container_id!=\"\"}[10m]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih besar dari 3
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [3]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 0s
        annotations:
          summary: "Container {{ $labels.container_id }} start ulang lebih dari 3x dalam 10 menit"
          description: "Container dengan id {{ $labels.container_id }} (cocokkan dengan docker ps) crash dan dijalankan ulang berulang."
        labels:
          severity: warning
          system: qms

  # ---- Grup: Galat dan latensi ----
  - orgId: 1
    name: qms-galat-dan-latensi
    # folder Grafana tempat aturan ini muncul
    folder: QMS Alert
    # interval evaluasi semua aturan di grup ini
    interval: 1m
    rules:

      # Rasio 5xx tinggi. Tanpa batas trafik minimum: pada trafik sangat kecil satu galat bisa melewati 5%. Ambang disetel ulang setelah ada data nyata.
      - uid: qms-5xx-ratio
        title: Rasio 5xx tinggi
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "sum by (service) (rate(http_requests_total{status=~\"5..\"}[5m])) / sum by (service) (rate(http_requests_total[5m]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih besar dari 0.05
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.05]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 5m
        annotations:
          summary: "Lebih dari 5% request {{ $labels.service }} berstatus 5xx"
          description: "Rasio galat server {{ $labels.service }} di atas 5% selama 5 menit. Cek dashboard QMS: Ikhtisar (RED) dan log ERROR service itu."
        labels:
          severity: critical
          system: qms

      # Latensi p95 tinggi. Ambang awal; disetel ulang setelah ada data nyata.
      - uid: qms-latency-p95
        title: Latensi p95 tinggi
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "histogram_quantile(0.95, sum by (le, service) (rate(http_request_duration_seconds_bucket[5m])))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih besar dari 1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [1]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 10m
        annotations:
          summary: "Latensi p95 {{ $labels.service }} di atas 1 detik"
          description: "Persentil ke-95 durasi request {{ $labels.service }} di atas 1 detik selama 10 menit (rute SSE tidak ikut dihitung)."
        labels:
          severity: warning
          system: qms

  # ---- Grup: Bisnis dan auth ----
  - orgId: 1
    name: qms-bisnis
    # folder Grafana tempat aturan ini muncul
    folder: QMS Alert
    # interval evaluasi semua aturan di grup ini
    interval: 1m
    rules:

      # Antrean email menumpuk. Ambang 50 adalah tebakan awal untuk skala demo; disetel ulang setelah ada data nyata.
      - uid: qms-email-backlog
        title: Antrean email menumpuk
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "max(mail_outbox_pending)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih besar dari 50
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [50]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 10m
        annotations:
          summary: "Antrean email menunggu lebih dari 50 selama 10 menit"
          description: "Baris outbox email yang belum terkirim menumpuk: mail-service mati, SMTP bermasalah, atau laju kirim kalah dari masuknya email."
        labels:
          severity: warning
          system: qms

      # Login gagal melonjak. Mencakup semua hasil selain ok. Ambang awal.
      - uid: qms-login-failures
        title: Login gagal melonjak
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "sum(increase(auth_login_total{result!=\"ok\"}[5m]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih besar dari 20
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [20]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 1m
        annotations:
          summary: "Lebih dari 20 login gagal dalam 5 menit"
          description: "Lonjakan login gagal (kredensial salah, rate limit, dst) bisa berarti tebak password atau masalah di auth-service."
        labels:
          severity: warning
          system: qms

      # Lonjakan langganan ditolak email belum diverifikasi. Berinformasi saja (severity info). Ambang awal.
      - uid: qms-email-not-verified
        title: Lonjakan langganan ditolak email belum diverifikasi
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "sum(increase(subscription_extend_total{result=\"email_not_verified\"}[15m]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih besar dari 10
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [10]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 0s
        annotations:
          summary: "Lebih dari 10 percobaan langganan ditolak EMAIL_NOT_VERIFIED dalam 15 menit"
          description: "Banyak owner mencoba berlangganan sebelum memverifikasi email: kemungkinan email verifikasi tidak sampai (cek mail-service dan Mailpit/SMTP)."
        labels:
          severity: info
          system: qms

  # ---- Grup: Infrastruktur ----
  - orgId: 1
    name: qms-infrastruktur
    # folder Grafana tempat aturan ini muncul
    folder: QMS Alert
    # interval evaluasi semua aturan di grup ini
    interval: 1m
    rules:

      # Koneksi PostgreSQL hampir penuh. Ambang 80% dari rencana.
      - uid: qms-postgres-connections
        title: Koneksi PostgreSQL hampir penuh
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "sum(pg_stat_database_numbackends) / max(pg_settings_max_connections)"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih besar dari 0.8
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0.8]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 5m
        annotations:
          summary: "Koneksi PostgreSQL di atas 80% dari batas"
          description: "Jumlah koneksi aktif mendekati max_connections. Cek kebocoran koneksi atau naikkan batas."
        labels:
          severity: warning
          system: qms

      # Disk host hampir penuh. Ambang 15% dari rencana.
      - uid: qms-disk-low
        title: Disk host hampir penuh
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"}"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih kecil dari 0.15
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.15]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 5m
        annotations:
          summary: "Ruang disk tersisa di bawah 15%"
          description: "Sistem berkas akar host tinggal kurang dari 15%. Log Docker, volume Loki, Prometheus, dan Tempo ikut memakai ruang ini."
        labels:
          severity: critical
          system: qms

      # Memori host hampir habis. Ambang 10% dari rencana. RAM host terbatas (sekitar 7,7 GB).
      - uid: qms-memory-low
        title: Memori host hampir habis
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke prometheus untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              datasource: {type: prometheus, uid: prometheus}
              expr: "node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih kecil dari 0.1
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: lt, params: [0.1]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 5m
        annotations:
          summary: "Memori tersedia di bawah 10%"
          description: "MemAvailable host di bawah 10% dari total. Stack observability bisa dimatikan dulu (make obs-down) untuk melegakan RAM."
        labels:
          severity: critical
          system: qms

  # ---- Grup: nginx ----
  - orgId: 1
    name: qms-nginx
    # folder Grafana tempat aturan ini muncul
    folder: QMS Alert
    # interval evaluasi semua aturan di grup ini
    interval: 1m
    rules:

      # Lonjakan rate limit (429). Dihitung dari log akses nginx di Loki (nginx-exporter tidak membedakan status). Ambang awal.
      - uid: qms-nginx-429
        title: Lonjakan rate limit (429)
        # condition menunjuk langkah terakhir (C) yang menentukan Firing atau Normal
        condition: C
        data:
          # A: query ke loki untuk 10 menit terakhir; instant = hanya nilai terbaru
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: loki
            model:
              refId: A
              datasource: {type: loki, uid: loki}
              expr: "sum(count_over_time({service=\"nginx\"} | status=\"429\" [5m]))"
              instant: true
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          # B: reduce, ambil nilai terakhir tiap deret (satu deret per service atau container)
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              datasource: {type: __expr__, uid: __expr__}
          # C: threshold, Firing bila nilai lebih besar dari 50
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [50]}
              datasource: {type: __expr__, uid: __expr__}
        noDataState: OK
        # galat saat evaluasi (mis. datasource mati) ditandai Error agar terlihat, bukan dianggap Normal
        execErrState: Error
        for: 0s
        annotations:
          summary: "Lebih dari 50 respons 429 dalam 5 menit"
          description: "nginx menolak banyak request karena rate limit: ada klien yang membanjiri login, join, reset password, atau layar publik."
        labels:
          severity: warning
          system: qms
