# =============================================================================
# nginx.conf (frontend): nginx di dalam kontainer frontend. Menyajikan hasil `expo export`.
# -----------------------------------------------------------------------------
# Dipakai oleh : frontend/Dockerfile, tahap prod (COPY ke /etc/nginx/nginx.conf).
# Dipanggil oleh: reverse proxy (deploy/nginx/server.conf) lewat $qms_frontend = http://frontend:80.
# Beda dengan  : deploy/nginx/nginx.conf (reverse proxy utama, satu-satunya pintu masuk). Berkas ini
#                hanya melayani file statis; tidak ada proxy, rate limit, atau logika auth di sini.
# Saat PINDAH DOMAIN / ubah topologi, periksa:
#   [GANTI-JARINGAN] listen 80 harus sama dengan port yang dipakai deploy/nginx/server.conf
#                    ($qms_frontend = http://frontend:80) dan EXPOSE 80 di frontend/Dockerfile.
#   [SINKRON]        try_files dan aturan cache harus sesuai cara Expo menghasilkan output
#                    (satu HTML per rute). Jika Expo berubah, tinjau ulang location /.
# Jangan ubah tanpa memeriksa: aturan no-store di location / dan no-cache di /sw.js (lihat catatan di bawah).
# =============================================================================

# Konteks events{} kosong: memakai nilai bawaan nginx untuk jumlah koneksi per worker.
events {}

http {
    # Memuat daftar tipe MIME bawaan nginx (mis. .js -> application/javascript). Tanpa ini, browser salah membaca aset.
    include mime.types;

    # Blok server{}: satu virtual host yang melayani file statis di port 80.
    server {
        # [GANTI-JARINGAN] Port di dalam kontainer. Harus sama dengan $qms_frontend di deploy/nginx/server.conf.
        listen 80;
        # Folder hasil export Expo yang disalin Dockerfile ke /usr/share/nginx/html. Semua file statis dilayani dari sini.
        root /usr/share/nginx/html;
        # Redirect direktori (/queues -> /queues/) harus relatif: nginx ini ada di belakang
        # reverse proxy, jadi host absolutnya (frontend:80) tidak bisa dibuka browser.
        # off = nginx menulis Location relatif (mis. /queues/), bukan http://frontend:80/queues/.
        absolute_redirect off;

        # [SESUAIKAN] Kompresi gzip untuk mengurangi ukuran transfer aset ke HP dan browser.
        # on: aktifkan gzip.
        gzip on;
        # Menambahkan header Vary: Accept-Encoding agar cache proxy tidak mengirim versi terkompres ke klien yang tidak menerimanya.
        gzip_vary on;
        # any: kompres juga respons yang datang dari proxy. Penting karena nginx ini selalu di belakang reverse proxy.
        gzip_proxied any;
        # Jenis konten yang dikompres. Gambar biner (png, jpg) tidak perlu, karena sudah terkompres.
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        # [SESUAIKAN] Level kompresi 1 (cepat, kecil) sampai 9 (lambat, paling kecil). 6 adalah keseimbangan yang umum.
        gzip_comp_level 6;
        # [SESUAIKAN] Respons di bawah 1000 byte tidak dikompres: overhead header lebih besar dari penghematan.
        gzip_min_length 1000;

        # [PENTING] Service worker tidak boleh di-cache lama, agar pembaruan sampai ke browser.
        # location = mencocokkan path persis /sw.js, bukan prefix.
        location = /sw.js {
            # no-cache: browser boleh menyimpan, tetapi wajib memvalidasi ulang ke server sebelum dipakai.
            add_header Cache-Control "no-cache";
            # Mengizinkan service worker di /sw.js mengontrol seluruh situs (scope "/"), bukan hanya folder skrip.
            add_header Service-Worker-Allowed "/";
        }

        # [SESUAIKAN] Aset statis (JS, CSS, gambar) yang nama filenya sudah berisi hash dari Expo.
        # Regex: cocok dengan akhiran ekstensi tertentu.
        location ~ \.(css|svg|js|png|jpeg|jpg|ico)$ {
            # Tidak mencatat log akses untuk aset: ratusan request per halaman akan memenuhi log tanpa nilai.
            access_log off;
            # public: boleh disimpan proxy dan browser. max-age=31536000 = 1 tahun. Aman karena nama file berubah
            # setiap kali isinya berubah (hash di nama file).
            add_header Cache-Control "public, max-age=31536000";
        }

        # Fallback untuk semua path lain: halaman aplikasi, dan path yang tidak ada.
        location / {
            # Halaman default untuk path berakhiran "/" (mis. /).
            index index.html;
            # [PENTING] Urutan pencarian berkas untuk path /xyz:
            #   $uri       -> file persis (mis. /assets/logo.png)
            #   $uri.html  -> satu HTML per rute dari Expo (mis. /dashboard -> dashboard.html)
            #   $uri/      -> folder, lalu index.html di dalamnya
            #   /index.html -> fallback terakhir: aplikasi single-page, rute tak dikenal ditangani di sisi klien
            try_files $uri $uri.html $uri/ /index.html;

            # no-store: HTML tidak boleh disimpan di cache mana pun, supaya rute baru langsung terlihat setelah deploy.
            # must-revalidate dan proxy-revalidate: cegah cache memakai salinan yang sudah basi.
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            # Header Pragma untuk klien HTTP/1.0 yang tidak memahami Cache-Control.
            add_header Pragma "no-cache";
        }
    }
}
