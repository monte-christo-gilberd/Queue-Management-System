# Nginx untuk kontainer frontend (hasil `expo export`), mengikuti
# template-nginx/nginx-frontend.conf.example. Dipanggil reverse proxy lewat frontend:80.

events {}

http {
    include mime.types;

    server {
        listen 80;
        root /usr/share/nginx/html;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
        gzip_comp_level 6;
        gzip_min_length 1000;

        location ~ \.(css|svg|js|png|jpeg|jpg|ico)$ {
            access_log off;
            add_header Cache-Control "public, max-age=31536000";
        }

        location / {
            index index.html;
            # Expo membuat satu HTML per rute (mis. dashboard.html), jadi $uri.html dicek juga.
            try_files $uri $uri.html $uri/ /index.html;

            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
            add_header Pragma "no-cache";
        }
    }
}
