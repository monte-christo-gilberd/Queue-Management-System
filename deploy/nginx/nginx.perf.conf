# =============================================================================
# nginx.perf.conf: konfigurasi nginx KHUSUS UJI BEBAN (perf/). JANGAN dipakai di dev harian maupun prod.
# -----------------------------------------------------------------------------
# Dipakai oleh : docker-compose.perf.yml (build arg NGINX_CONF=nginx.perf.conf), lewat `make perf-up`.
# Beda dengan  : nginx.conf (dev). Isi http{} sama, kecuali:
#   [PERF] worker_processes auto, worker_rlimit_nofile, dan worker_connections besar. nginx.conf dev memakai events{}
#          kosong, yaitu bawaan nginx: 1 worker dengan 512 koneksi. Satu pengamat SSE memakai dua koneksi (klien dan
#          upstream), jadi bawaan itu membatasi sekitar 250 pengamat serentak.
#   [PERF] Semua zona limit_req dilonggarkan (satu IP generator tidak boleh terkena 429 saat mengukur kapasitas).
#   [PERF] access_log dimatikan (log per request di stdout membebani uji; lihat juga server.perf.conf yang dibuat
#          `make perf-up` tanpa baris access_log per location).
# Isi server{} tetap server.conf (routing sama dengan dev). Jangan ubah tanpa memeriksa: nama zona limit_req.
# =============================================================================

# [PERF] Satu worker per CPU dan batas file terbuka yang besar (tiap koneksi memakai satu fd).
worker_processes auto;
worker_rlimit_nofile 262144;

# [PERF] Koneksi per worker besar: pengamat SSE menahan koneksi berjam-jam. multi_accept menerima banyak koneksi
# sekaligus saat lonjakan join.
events {
    worker_connections 65536;
    multi_accept on;
}

http {
    # [PERF] Tanpa log akses: tidak ada tulis per request selama uji.
    access_log off;

    # [PENTING] Blok map: menentukan nilai variabel $connection_upgrade dari header $http_upgrade.
    # Jika klien meminta upgrade (WebSocket), nilainya "upgrade". Jika tidak, "close".
    # Dipakai oleh frontend-upgrade.dev.conf untuk HMR Metro.
    map $http_upgrade $connection_upgrade {
        # Nilai bawaan saat header Upgrade ada atau tidak ada yang cocok dengan pola di bawah: upgrade.
        default upgrade;
        # Header Upgrade kosong: tidak ada permintaan upgrade, jadi koneksi ditutup seperti biasa.
        ''      close;
    }

    # [SESUAIKAN] Zona limit_req untuk login dan register: menyimpan status per IP klien ($binary_remote_addr).
    # 10m: ukuran memori zona, muat sekitar 160 ribu IP. rate=10r/s: 10 permintaan per detik per IP.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=1000000r/s;
    # [SESUAIKAN] Zona untuk join lewat token QR. Sama dengan login: 10 r/s per IP, 10 MB.
    limit_req_zone $binary_remote_addr zone=join_zone:10m rate=1000000r/s;
    # [SESUAIKAN] Zona untuk unggah foto profil: 5 permintaan per detik per IP.
    limit_req_zone $binary_remote_addr zone=avatar_zone:10m rate=1000000r/s;
    # [SESUAIKAN] Lupa/reset password: 1 permintaan per detik per IP. Lebih ketat dari login karena
    # setiap permintaan bisa mengirim satu email.
    limit_req_zone $binary_remote_addr zone=reset_zone:10m rate=1000000r/s;
    # [SESUAIKAN] Layar publik: 20 permintaan per detik per IP. Beberapa layar bisa berbagi satu IP
    # (jaringan kantor), dan tiap event memicu satu pengambilan ulang.
    limit_req_zone $binary_remote_addr zone=display_zone:10m rate=1000000r/s;

    # [PENTING] Blok map untuk menyamarkan token di log. Menghasilkan variabel $uri_masked dari $uri:
    # bagian token di path (/display/<token>, /api/v1/display/<token>) diganti "***", sisanya dibiarkan.
    map $uri $uri_masked {
        # Regex: tangkap awalan (display/ atau api/v1/display/), token setelahnya, dan sisa path.
        # Token ditulis sebagai *** pada hasil; awalan dan sisa path dipertahankan.
        ~^(?<mask_head>/(?:api/v1/)?display/)[^/]+(?<mask_tail>.*)$ "${mask_head}***${mask_tail}";
        # Path lain tidak diubah.
        default $uri;
    }
    # [PENTING] Format log yang dipakai location sensitif (access_log ... qms_masked). Mencatat $uri_masked,
    # bukan $request_uri, sehingga query string (?token=) tidak pernah masuk log.
    log_format qms_masked '$remote_addr - [$time_local] "$request_method $uri_masked $server_protocol" '
                          # Baris lanjutan: status, ukuran body, referer (kosong, "-"), dan User-Agent.
                          '$status $body_bytes_sent "-" "$http_user_agent"';
    # [SESUAIKAN] Balasan untuk permintaan yang melewati batas laju: 429 (bukan 503 bawaan) supaya klien tahu
    # harus menunggu, bukan menganggap server rusak.
    limit_req_status 429;


    # Blok server{}: satu virtual host yang menerima request di port 80.
    server {
        # [GANTI-JARINGAN] Port yang didengarkan di dalam kontainer. Harus sama dengan EXPOSE di Dockerfile dan
        # sisi kanan pemetaan port di docker-compose.yml.
        # [PERF] Antrean koneksi masuk diperbesar untuk lonjakan join (dibatasi net.core.somaxconn host).
        listen 80 backlog=8192;
        # [GANTI-DOMAIN] Dev: localhost. Hanya untuk identifikasi, karena dev menerima Host apa pun.
        server_name localhost;

        # Mengambil isi server{} bersama (routing, rate limit per rute, header, pembayaran) dari server.conf.
        include /etc/nginx/snippets/server.conf;
    }
}
