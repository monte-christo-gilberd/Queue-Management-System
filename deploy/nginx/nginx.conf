# Reverse proxy QMS, mengikuti template-nginx/nginx-reverse-proxy.conf.example.
# Nama host (backend, qr-service, frontend) adalah nama service di docker-compose.yml.
# Hanya kontainer ini yang membuka port ke host.

events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Batas laju untuk endpoint yang rawan disalahgunakan (per IP klien).
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=join_zone:10m rate=10r/s;
    limit_req_status 429;


    server {
        listen 80;
        server_name localhost;

        include /etc/nginx/snippets/server.conf;
    }
}
