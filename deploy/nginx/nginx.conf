# =============================================================================
# nginx.conf: reverse proxy QMS untuk DEVELOPMENT (docker-compose.yml).
# -----------------------------------------------------------------------------
# Dipakai oleh : Dockerfile, sebagai /etc/nginx/nginx.conf, bila build arg NGINX_CONF
#                tidak diubah (nilai bawaan).
# Beda dengan  : nginx.prod.conf (produksi di belakang Cloudflare Tunnel). Keduanya
#                berbagi isi http{} yang sama, dengan dua perbedaan: IP klien dan
#                server_name. Isi server{} diambil dari server.conf (dipakai bersama).
# Saat PINDAH DOMAIN / ubah topologi, periksa:
#   [GANTI-DOMAIN]   server_name localhost. Dev menerima Host apa pun lewat port
#                    yang dipetakan, jadi nilai ini hanya untuk identifikasi.
#   [GANTI-JARINGAN] port 80 di sini harus sama dengan sisi kanan pemetaan port
#                    "${QMS_HTTP_PORT:-8080}:80" di docker-compose.yml.
#   [SINKRON]        seluruh blok http{} (zona, map, log_format) harus sama dengan
#                    nginx.prod.conf. Ubah di kedua berkas bila ada perubahan.
# Jangan ubah tanpa memeriksa: nama zona limit_req (dipakai server.conf) dan map
#                    $uri_masked (menyamarkan token dari log JSON qms_json).
# =============================================================================

# events{} kosong: memakai nilai bawaan nginx untuk jumlah koneksi per worker.
events {}

http {
    # [PENTING] Blok map: menentukan nilai variabel $connection_upgrade dari header $http_upgrade.
    # Jika klien meminta upgrade (WebSocket), nilainya "upgrade". Jika tidak, "close".
    # Dipakai oleh frontend-upgrade.dev.conf untuk HMR Metro.
    map $http_upgrade $connection_upgrade {
        # Nilai bawaan saat header Upgrade ada atau tidak ada yang cocok dengan pola di bawah: upgrade.
        default upgrade;
        # Header Upgrade kosong: tidak ada permintaan upgrade, jadi koneksi ditutup seperti biasa.
        ''      close;
    }

    # [SESUAIKAN] Zona limit_req untuk login dan register: menyimpan status per IP klien ($binary_remote_addr).
    # 10m: ukuran memori zona, muat sekitar 160 ribu IP. rate=10r/s: 10 permintaan per detik per IP.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    # [SESUAIKAN] Zona untuk join lewat kode antrian (kode 6 karakter dari QR). Sama dengan login: 10 r/s per IP, 10 MB.
    limit_req_zone $binary_remote_addr zone=join_zone:10m rate=10r/s;
    # [SESUAIKAN] Zona untuk unggah foto profil: 5 permintaan per detik per IP.
    limit_req_zone $binary_remote_addr zone=avatar_zone:10m rate=5r/s;
    # [SESUAIKAN] Lupa/reset password: 1 permintaan per detik per IP. Lebih ketat dari login karena
    # setiap permintaan bisa mengirim satu email.
    limit_req_zone $binary_remote_addr zone=reset_zone:10m rate=1r/s;
    # [SESUAIKAN] Layar publik: 20 permintaan per detik per IP. Beberapa layar bisa berbagi satu IP
    # (jaringan kantor), dan tiap event memicu satu pengambilan ulang.
    limit_req_zone $binary_remote_addr zone=display_zone:10m rate=20r/s;

    # [PENTING] Blok map untuk menyamarkan token di log. Menghasilkan variabel $uri_masked dari $uri:
    # bagian token di path (/display/<token>, /api/v1/display/<token>) diganti "***", sisanya dibiarkan.
    map $uri $uri_masked {
        # Regex: tangkap awalan (display/ atau api/v1/display/), token setelahnya, dan sisa path.
        # Token ditulis sebagai *** pada hasil; awalan dan sisa path dipertahankan.
        ~^(?<mask_head>/(?:api/v1/)?display/)[^/]+(?<mask_tail>.*)$ "${mask_head}***${mask_tail}";
        # Path lain tidak diubah.
        default $uri;
    }
    # [PENTING] Format log akses JSON, satu baris per request, dipakai SEMUA location lewat access_log di bawah.
    # Mencatat $uri_masked (token diganti ***), bukan $request_uri, sehingga query string (?token=) tidak pernah
    # masuk log. escape=json menjaga nilai tetap JSON sah walau berisi tanda kutip. Semua nilai ditulis sebagai
    # string karena $upstream_response_time bisa berisi beberapa angka ("0.002, 0.004") atau kosong.
    # request_id sama dengan header X-Request-Id yang diteruskan ke backend dan auth-service, jadi satu request
    # bisa diikuti dari nginx sampai service.
    log_format qms_json escape=json
        '{"time":"$time_iso8601","service":"nginx","request_id":"$request_id","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri_masked","status":"$status","bytes":"$body_bytes_sent",'
        '"request_time":"$request_time","upstream_response_time":"$upstream_response_time"}';
    # [PENTING] Log akses global ke stdout kontainer dengan format JSON di atas. Location /health memakai
    # access_log off sendiri, dan tidak ada location yang perlu format khusus lagi karena token sudah disamarkan.
    access_log /dev/stdout qms_json;
    # [SESUAIKAN] Balasan untuk permintaan yang melewati batas laju: 429 (bukan 503 bawaan) supaya klien tahu
    # harus menunggu, bukan menganggap server rusak.
    limit_req_status 429;


    # [PENTING] Listener status INTERNAL untuk Prometheus (nginx-prometheus-exporter membaca /stub_status). Port 8081
    # TIDAK dipetakan ke host di docker-compose dan tidak ada hubungannya dengan server{} publik di bawah, jadi
    # tidak bisa dijangkau lewat nginx dari luar. allow hanya rentang IP privat (jaringan Docker); selain itu 403.
    server {
        listen 8081;
        access_log off;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        location = /stub_status {
            stub_status;
        }
        location / {
            return 404;
        }
    }

    # Blok server{}: satu virtual host yang menerima request di port 80.
    server {
        # [GANTI-JARINGAN] Port yang didengarkan di dalam kontainer. Harus sama dengan EXPOSE di Dockerfile dan
        # sisi kanan pemetaan port di docker-compose.yml.
        listen 80;
        # [GANTI-DOMAIN] Dev: localhost. Hanya untuk identifikasi, karena dev menerima Host apa pun.
        server_name localhost;

        # Mengambil isi server{} bersama (routing, rate limit per rute, header, pembayaran) dari server.conf.
        include /etc/nginx/snippets/server.conf;
    }
}
