# Reverse proxy QMS untuk demo/produksi di belakang Cloudflare Tunnel.
# Beda dengan nginx.conf (dev): IP klien dibaca dari CF-Connecting-IP.
# cloudflared berjalan di host, jadi nginx melihat koneksi dari gateway bridge
# (172.29.0.1). Port nginx hanya terikat ke 127.0.0.1 di compose, sehingga hanya
# cloudflared yang bisa mengirim header ini.

events {}

http {
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    set_real_ip_from 172.29.0.0/16;
    real_ip_header CF-Connecting-IP;

    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=join_zone:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=avatar_zone:10m rate=5r/s;
    # Lupa/reset password lebih ketat dari login: tiap permintaan bisa mengirim satu email.
    limit_req_zone $binary_remote_addr zone=reset_zone:10m rate=1r/s;
    # Layar publik: beberapa layar bisa berbagi satu IP (jaringan kantor) dan tiap event memicu satu pengambilan ulang.
    limit_req_zone $binary_remote_addr zone=display_zone:10m rate=20r/s;
    # Checkout pembayaran: tiap permintaan membuka satu sesi Stripe, jadi dibatasi ketat per IP.
    limit_req_zone $binary_remote_addr zone=payment_zone:10m rate=2r/s;
    # Log tanpa query string: tautan reset membawa token di ?token=, dan token tidak boleh masuk log.
    # Token layar publik ada di path (/display/<token>, /api/v1/display/<token>[/event]): disamarkan juga.
    map $uri $uri_masked {
        ~^(?<mask_head>/(?:api/v1/)?display/)[^/]+(?<mask_tail>.*)$ "${mask_head}***${mask_tail}";
        default $uri;
    }
    log_format qms_masked '$remote_addr - [$time_local] "$request_method $uri_masked $server_protocol" '
                          '$status $body_bytes_sent "-" "$http_user_agent"';
    limit_req_status 429;

    server_tokens off;

    server {
        listen 80;
        server_name _;

        include /etc/nginx/snippets/server.conf;
    }
}
