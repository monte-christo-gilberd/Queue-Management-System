# =============================================================================
# nginx.prod.conf: reverse proxy QMS untuk PRODUKSI/DEMO di belakang Cloudflare Tunnel.
# -----------------------------------------------------------------------------
# Dipakai oleh : Dockerfile, sebagai /etc/nginx/nginx.conf, bila build arg NGINX_CONF=nginx.prod.conf
#                (diatur di docker-compose.prod.yml).
# Beda dengan  : nginx.conf (dev). Perbedaan utama: IP klien dibaca dari CF-Connecting-IP
#                (set_real_ip_from), dan server_tokens off. Blok http{} selain itu sama
#                dengan nginx.conf. Isi server{} diambil dari server.conf (dipakai bersama).
# Alur: internet -> Cloudflare -> cloudflared di host -> nginx (127.0.0.1:8080) -> kontainer.
#        nginx hanya terikat ke 127.0.0.1 (lihat docker-compose.prod.yml), jadi hanya cloudflared
#        yang bisa mengirim header CF-Connecting-IP. Itu sebabnya header tersebut dipercaya.
# Saat PINDAH DOMAIN / ubah topologi, periksa:
#   [GANTI-DOMAIN]   server_name _ (menerima Host apa pun; domain sebenarnya diatur tunnel).
#                    Ganti dengan domain bila ingin menolak Host lain.
#   [GANTI-DOMAIN]   real_ip_header CF-Connecting-IP. Khusus Cloudflare. Tanpa Cloudflare,
#                    ganti dengan X-Forwarded-For dan sesuaikan set_real_ip_from.
#   [GANTI-JARINGAN] set_real_ip_from 172.29.0.0/16 harus sama dengan subnet prod di
#                    docker-compose.prod.yml dan TRUSTED_PROXIES backend (172.29.0.0/16).
#   [SINKRON]        seluruh blok http{} kecuali dua hal di atas sama dengan nginx.conf.
# Jangan ubah tanpa memeriksa: set_real_ip_from. Subnet yang terlalu lebar membuat klien
#                    lain bisa memalsukan IP lewat header CF-Connecting-IP.
# =============================================================================

# events{} kosong: memakai nilai bawaan nginx untuk jumlah koneksi per worker.
events {}

http {
    # [PENTING] Blok map: menentukan $connection_upgrade dari header $http_upgrade. "upgrade" bila klien meminta
    # upgrade, "close" bila tidak. Di produksi frontend-upgrade.prod.conf kosong, jadi nilai ini tidak dipakai,
    # tetapi tetap didefinisikan karena server.conf membutuhkannya saat include.
    map $http_upgrade $connection_upgrade {
        # Nilai bawaan: upgrade, bila header Upgrade ada.
        default upgrade;
        # Header Upgrade kosong: koneksi ditutup seperti biasa.
        ''      close;
    }

    # [GANTI-DOMAIN] [GANTI-JARINGAN] Menentukan IP klien asli. Hanya koneksi dari subnet 172.29.0.0/16
    # yang dipercaya membawa IP asli di CF-Connecting-IP. 172.29.0.1 adalah gateway bridge kontainer,
    # tempat cloudflared (di host) terhubung.
    set_real_ip_from 172.29.0.0/16;
    # [GANTI-DOMAIN] Header yang dibaca untuk IP klien asli. Cloudflare mengirimnya di setiap request.
    # Setelah diganti, $remote_addr berisi IP klien, bukan IP gateway.
    real_ip_header CF-Connecting-IP;

    # [SESUAIKAN] Zona limit_req untuk login dan register, per IP klien. Nilainya sama dengan nginx.conf.
    # Karena IP klien sudah benar berkat real_ip, batas ini membatasi setiap pengunjung, bukan Cloudflare.
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/s;
    # [SESUAIKAN] Zona untuk join lewat token QR: 10 permintaan per detik per IP, 10 MB.
    limit_req_zone $binary_remote_addr zone=join_zone:10m rate=10r/s;
    # [SESUAIKAN] Zona untuk unggah foto profil: 5 permintaan per detik per IP.
    limit_req_zone $binary_remote_addr zone=avatar_zone:10m rate=5r/s;
    # [SESUAIKAN] Lupa/reset password: 1 permintaan per detik per IP, lebih ketat dari login karena tiap
    # permintaan bisa mengirim satu email.
    limit_req_zone $binary_remote_addr zone=reset_zone:10m rate=1r/s;
    # [SESUAIKAN] Layar publik: 20 permintaan per detik per IP. Beberapa layar bisa berbagi satu IP.
    limit_req_zone $binary_remote_addr zone=display_zone:10m rate=20r/s;
    # [SESUAIKAN] Checkout pembayaran: 2 permintaan per detik per IP. Tiap permintaan membuka sesi Stripe.
    limit_req_zone $binary_remote_addr zone=payment_zone:10m rate=2r/s;

    # [PENTING] Blok map untuk menyamarkan token di log (sama dengan nginx.conf). Token di path
    # (/display/<token>, /api/v1/display/<token>) diganti "***" di $uri_masked.
    map $uri $uri_masked {
        # Regex: tangkap awalan, token, dan sisa path. Token diganti *** di hasil.
        ~^(?<mask_head>/(?:api/v1/)?display/)[^/]+(?<mask_tail>.*)$ "${mask_head}***${mask_tail}";
        # Path lain tidak diubah.
        default $uri;
    }
    # [PENTING] Format log yang dipakai location sensitif (access_log ... qms_masked). Mencatat $uri_masked,
    # bukan $request_uri, sehingga query string tidak masuk log.
    log_format qms_masked '$remote_addr - [$time_local] "$request_method $uri_masked $server_protocol" '
                          # Baris lanjutan: status, ukuran body, referer (kosong, "-"), dan User-Agent.
                          '$status $body_bytes_sent "-" "$http_user_agent"';
    # [SESUAIKAN] Balasan 429 (bukan 503 bawaan) untuk permintaan yang melewati batas laju.
    limit_req_status 429;

    # [PENTING] Menyembunyikan versi nginx dari header Server dan halaman error. Versi yang terlihat membantu
    # penyerang mencari celah yang sudah diketahui.
    server_tokens off;

    # Blok server{}: satu virtual host yang menerima request di port 80.
    server {
        # [GANTI-JARINGAN] Port yang didengarkan di dalam kontainer. Harus sama dengan EXPOSE di Dockerfile dan
        # sisi kanan pemetaan port di docker-compose.prod.yml (127.0.0.1:8080:80).
        listen 80;
        # [GANTI-DOMAIN] "_" berarti menerima Host apa pun. Domain yang dipakai browser diatur di Cloudflare,
        # dan QMS_PUBLIC_ORIGIN (.env) harus sama dengan domain itu.
        server_name _;

        # Mengambil isi server{} bersama (routing, rate limit per rute, header, pembayaran) dari server.conf.
        include /etc/nginx/snippets/server.conf;
    }
}
