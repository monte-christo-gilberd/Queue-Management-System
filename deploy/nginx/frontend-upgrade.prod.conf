# =============================================================================
# frontend-upgrade.prod.conf: SENGAJA KOSONG. Jangan dihapus.
# -----------------------------------------------------------------------------
# Dipakai oleh : Dockerfile (di-COPY menjadi /etc/nginx/snippets/frontend-upgrade.conf) bila
#                build arg FRONTEND_UPGRADE=frontend-upgrade.prod.conf (docker-compose.prod.yml).
#                server.conf meng-include berkas ini, jadi file wajib ada agar nginx tetap start.
# Beda dengan  : frontend-upgrade.dev.conf, yang berisi header WebSocket untuk HMR Metro.
# Tujuan: frontend produksi adalah berkas statis, tidak ada WebSocket. Berkas kosong
#         berarti location / tidak menambah header upgrade apa pun.
# Jangan ubah tanpa memeriksa: jika berkas ini dihapus, COPY di Dockerfile gagal dan nginx
#                  tidak bisa dibangun. Jika isinya diganti dengan header WebSocket, produksi
#                  ikut membuka jalur upgrade yang tidak diperlukan.
# =============================================================================
