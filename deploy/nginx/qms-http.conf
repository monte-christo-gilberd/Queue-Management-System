# Tahap 1 (HTTP saja): dipakai untuk uji awal dan agar certbot bisa memverifikasi domain.
# Ganti QMS_DOMAIN dan QMS_FRONTEND_DIR sebelum dipasang (lihat README.md di folder ini).

upstream qms_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream qr_service {
    server 127.0.0.1:8090;
    keepalive 8;
}

# Batasi scan/render QR publik (20 r/s per IP, burst 40).
limit_req_zone $binary_remote_addr zone=qr_join:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name QMS_DOMAIN;

    # Tantangan ACME untuk certbot (webroot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Endpoint internal qr-service tidak boleh dijangkau dari luar.
    location /internal/ {
        return 404;
    }

    # QR join dirender qr-service (cache header datang dari service).
    location /qr/ {
        limit_req zone=qr_join burst=40 nodelay;
        proxy_pass http://qr_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 30s;
    }

    # API (termasuk SSE): diteruskan ke backend Go. Konfigurasi SSE tanpa buffer ada di qms.conf.
    location /api/ {
        proxy_pass http://qms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend statis (hasil `npx expo export --platform web` -> folder dist).
    root QMS_FRONTEND_DIR;
    index index.html;

    location / {
        # Expo static export membuat satu HTML per rute (mis. dashboard.html), jadi cek .html juga.
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Aset ber-hash dari Expo: aman di-cache lama.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
