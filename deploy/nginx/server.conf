# Isi server{} bersama untuk HTTP (nginx.conf) dan HTTPS (https.conf).
client_max_body_size 1m;

# Header proxy umum
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Endpoint internal qr-service tidak boleh dijangkau dari luar (defense in depth).
location /internal/ {
    return 404;
}

# SSE: diteruskan tanpa buffer dan dengan timeout panjang agar event Next/Skip
# sampai ke customer seketika. Lokasi regex diperiksa lebih dulu daripada prefix.
location ~ ^/api/v1/queues/[0-9]+/event$ {
    proxy_pass http://backend:8080;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Login dan register dibatasi lajunya.
location ~ ^/api/v1/users/(login|register)$ {
    limit_req zone=auth_zone burst=20 nodelay;
    proxy_pass http://backend:8080;
}

# Join lewat token QR dibatasi lajunya.
location ~ ^/api/v1/join(/preview)?$ {
    limit_req zone=join_zone burst=20 nodelay;
    proxy_pass http://backend:8080;
}

# Liveness backend lewat nginx (healthcheck eksternal).
location = /health {
    access_log off;
    proxy_pass http://backend:8080;
}

# Backend API
location /api/ {
    proxy_pass http://backend:8080;
    proxy_read_timeout 60s;
}

# QR service (gambar QR publik; header cache datang dari service).
location /qr/ {
    limit_req zone=qr_zone burst=40 nodelay;
    proxy_pass http://qr-service:8090;
    proxy_cache off;
    proxy_read_timeout 30s;
}

# Frontend App (paling bawah)
location / {
    proxy_pass http://frontend:80;
    # HMR Metro (dev) memakai WebSocket.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
}
