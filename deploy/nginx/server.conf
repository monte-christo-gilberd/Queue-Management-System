# =============================================================================
# server.conf: isi server{} bersama (aturan routing QMS).
# -----------------------------------------------------------------------------
# Dipakai oleh : nginx.conf (dev) dan nginx.prod.conf (prod), lewat include
#                /etc/nginx/snippets/server.conf. Berkas ini di-COPY ke sana oleh Dockerfile.
# Beda dengan  : nginx.conf / nginx.prod.conf berisi http{}, zona rate limit, dan
#                format log. Berkas ini hanya berisi isi server{}, jadi aturan routing
#                hanya ditulis sekali dan dipakai dua mode.
# Saat PINDAH DOMAIN / ubah topologi, periksa:
#   [GANTI-JARINGAN] resolver, set $qms_backend, $qms_frontend, $qms_auth, $qms_payment
#                    -> harus sama dengan nama service dan port di docker-compose*.yml.
#   [SESUAIKAN]      client_max_body_size, nama zona limit_req, burst, timeout SSE.
#   [PENTING]        blok /internal/, X-Request-Id, Referrer-Policy, blok pembayaran. Log akses JSON global (qms_json)
#                    didefinisikan di nginx.conf / nginx.prod.conf.
# Jangan ubah tanpa memeriksa: urutan location (lihat catatan di bagian routing).
# =============================================================================

# [SESUAIKAN] Batas ukuran body semua request: 1 MB. Request yang lebih besar dibalas 413 oleh nginx
# sebelum sampai ke backend. Berlaku untuk seluruh API kecuali unggahan foto profil (lihat di bawah).
client_max_body_size 1m;

# [GANTI-JARINGAN] Resolver DNS internal Docker (127.0.0.11). Dipakai nginx untuk me-resolve nama host
# seperti "backend" di setiap permintaan, bukan sekali saat start.
# valid=5s: hasil DNS disimpan 5 detik sebelum di-resolve ulang, jadi restart backend tidak membuat 502 lama.
# ipv6=off: hanya meminta alamat IPv4, karena jaringan compose hanya memakai IPv4.
resolver 127.0.0.11 valid=5s ipv6=off;

# [GANTI-JARINGAN] Alamat upstream backend. Disimpan dalam variabel supaya nginx me-resolve nama host
# saat request masuk (lewat resolver di atas), bukan saat start. "backend:8080" harus sama dengan nama
# service dan port backend di docker-compose*.yml.
set $qms_backend http://backend:8080;
# [GANTI-JARINGAN] Alamat upstream frontend (kontainer nginx frontend, port 80). Nama "frontend" harus sama
# dengan nama service di docker-compose*.yml.
set $qms_frontend http://frontend:80;

# auth-service (login, registrasi, reset password, verifikasi email) TERPISAH dari backend: bila mati, hanya path auth di
# bawah yang gagal (JSON 503 AUTH_UNAVAILABLE); antrian, profil, SSE, dan pembayaran user yang sudah login tetap jalan
# karena backend memverifikasi JWT secara lokal. Variabel + resolver membuat nginx tetap start tanpa auth-service.
# [GANTI-JARINGAN] Alamat upstream auth-service, port 8094. Harus sama dengan service di docker-compose*.yml.
set $qms_auth http://auth-service:8094;
# payment-service (pembayaran BorderPay), port 8095. Hanya aktif dengan profil compose "payments"; bila belum
# jalan, webhook dibalas 502 tanpa menghalangi nginx start (variabel + resolver di atas).
set $qms_payment http://payment-service:8095;

# Mengirim HTTP/1.1 ke upstream. Diperlukan agar keep-alive dan streaming (SSE) bekerja.
proxy_http_version 1.1;
# Meneruskan nama host yang diminta klien ke backend, supaya backend bisa membangun tautan dengan benar.
proxy_set_header Host $http_host;
# Meneruskan IP klien langsung (dari koneksi yang diterima nginx) ke backend sebagai X-Real-IP.
proxy_set_header X-Real-IP $remote_addr;
# Menambahkan IP klien ke daftar proxy yang dilewati. Backend hanya mempercayainya dari TRUSTED_PROXIES.
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# Meneruskan skema asli (http atau https) ke backend, supaya tautan di email dan redirect benar.
proxy_set_header X-Forwarded-Proto $scheme;
# [PENTING] Meneruskan ID request buatan nginx ($request_id, 32 karakter hex acak) ke upstream. nginx SELALU menimpa
# nilai kiriman klien, sehingga klien tidak bisa menyisipkan ID palsu. Backend dan auth-service mencatatnya di log
# mereka, dan nilai yang sama ada di log akses nginx, jadi satu request bisa diikuti dari nginx sampai service.
# Catatan: location yang punya proxy_set_header sendiri (SSE) menggantikan header di sini, jadi mengulangnya.
proxy_set_header X-Request-Id $request_id;

# [PENTING] Melarang browser menebak tipe konten (MIME sniffing). Mencegah file yang diunggah dianggap skrip.
# "always" memastikan header tetap ada pada respons error juga.
add_header X-Content-Type-Options nosniff always;
# [PENTING] Dari situs lain, browser hanya menerima origin (bukan path) di header Referer.
# Mencegah path yang berisi data (misalnya token) bocor ke situs pihak ketiga.
add_header Referrer-Policy strict-origin-when-cross-origin always;
# [PENTING] Mengirim ID request ke klien di header respons, supaya pengguna atau tim dukungan bisa menyebutkannya
# saat melapor masalah. Location yang punya add_header sendiri menggantikan header di sini, jadi mengulangnya.
add_header X-Request-Id $request_id always;

location /internal/ {
    # Balas 404 langsung dari nginx, tanpa meneruskan ke upstream mana pun.
    return 404;
}

# [PENTING] SSE (Server-Sent Events) untuk event Next/Skip ke customer. Lokasi regex dicocokkan lebih dulu
# daripada prefix, jadi blok ini harus tetap di atas location /api/.
location ~ ^/api/v1/queues/[0-9]+/event$ {
    # Meneruskan request ke backend.
    proxy_pass $qms_backend;
    # Mengosongkan header Connection agar koneksi ke backend tetap terbuka (keep-alive), bukan ditutup.
    proxy_set_header Connection "";
    # Diulang karena proxy_set_header di location ini menggantikan yang di server{}: backend tetap menerima ID request.
    proxy_set_header X-Request-Id $request_id;
    # Mematikan buffer respons: setiap event langsung dikirim ke klien, tidak ditahan nginx.
    proxy_buffering off;
    # Mematikan cache untuk respons ini: event bersifat langsung dan tidak boleh disimpan.
    proxy_cache off;
    # Mengirim respons dalam bentuk chunked, cara streaming SSE yang benar.
    chunked_transfer_encoding on;
    # 86400s = 24 jam. Batas menunggu data dari backend; koneksi SSE dibiarkan terbuka lama.
    proxy_read_timeout 86400s;
    # 86400s = 24 jam. Batas mengirim data ke backend; sama panjangnya dengan read timeout.
    proxy_send_timeout 86400s;
}

# [SESUAIKAN] Login dan register dibatasi lajunya per IP. Regex menerima dua path ini saja. Dilayani auth-service.
location ~ ^/api/v1/users/(login|register)$ {
    # [SESUAIKAN] Memakai zona auth_zone (10 permintaan/detik per IP, didefinisikan di nginx.conf).
    # burst=20: boleh melonjak 20 permintaan sekaligus. nodelay: permintaan dalam burst langsung dilayani.
    # Melewati batas: dibalas 429.
    limit_req zone=auth_zone burst=20 nodelay;
    # Meneruskan request ke auth-service, bukan backend.
    proxy_pass $qms_auth;
    # 3 detik untuk membuka koneksi. Lebih lama dari itu dianggap mati, jadi cepat dialihkan ke 503.
    proxy_connect_timeout 3s;
    # 30 detik menunggu respons (bcrypt dan database).
    proxy_read_timeout 30s;
    # Bila upstream gagal (502, 503, 504), balas lewat @auth_unavailable (JSON 503).
    error_page 502 503 504 = @auth_unavailable;
}

# [SESUAIKAN] Login Google (tukar ID token) dan penautan akun (konfirmasi password). Dilayani auth-service, dibatasi per IP
# dengan zona auth_zone seperti login: /google/link menerima password, jadi sama sensitifnya dengan login. Batas salah
# password per link token (5 kali) ada di auth-service. Tanpa GOOGLE_CLIENT_IDS, auth-service menjawab 404.
location ~ ^/api/v1/users/google(/link)?$ {
    limit_req zone=auth_zone burst=20 nodelay;
    proxy_pass $qms_auth;
    proxy_connect_timeout 3s;
    # 30 detik: auth-service bisa perlu mengambil kunci publik Google (batas 5 detik) sebelum menjawab.
    proxy_read_timeout 30s;
    error_page 502 503 504 = @auth_unavailable;
}

# [SESUAIKAN] Lupa dan reset password: laju paling ketat per IP (zona reset_zone, 1 permintaan/detik).
# Setiap permintaan bisa mengirim satu email, jadi dibatasi lebih ketat dari login. Batas per akun ada di auth-service.
location ~ ^/api/v1/users/(forgot-password|reset-password)$ {
    # [SESUAIKAN] Zona reset_zone (1 r/s per IP). burst=5: lonjakan 5 permintaan diizinkan. nodelay: langsung dilayani.
    limit_req zone=reset_zone burst=5 nodelay;
    # Meneruskan request ke auth-service.
    proxy_pass $qms_auth;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    error_page 502 503 504 = @auth_unavailable;
}

# [SESUAIKAN] Verifikasi email (token di body, dari tautan email) dan kirim ulang tautan (butuh login). Dibatasi
# per IP dengan zona auth_zone; batas 3 per jam per akun ada di auth-service. Kedua lokasi dicocokkan persis (=).
location = /api/v1/users/verify-email {
    limit_req zone=auth_zone burst=20 nodelay;
    proxy_pass $qms_auth;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    error_page 502 503 504 = @auth_unavailable;
}
location = /api/v1/users/me/verify-email/resend {
    limit_req zone=auth_zone burst=20 nodelay;
    proxy_pass $qms_auth;
    proxy_connect_timeout 3s;
    proxy_read_timeout 30s;
    error_page 502 503 504 = @auth_unavailable;
}

# [PENTING] Dipakai bila auth-service mati atau tidak terjangkau. Balasannya JSON dengan kode AUTH_UNAVAILABLE, sama
# dengan kontrak galat backend. Frontend TIDAK boleh logout pada 503 ini: user yang sudah login tetap bisa memakai
# aplikasi (backend memverifikasi token secara lokal). Hanya 401 yang mengakhiri sesi.
location @auth_unavailable {
    # Menetapkan Content-Type respons ke JSON.
    default_type application/json;
    # Memberi tahu klien untuk mencoba lagi setelah 30 detik. always: header tetap ada pada respons error.
    add_header Retry-After 30 always;
    # Diulang karena add_header di location ini menggantikan yang di server{}.
    add_header X-Request-Id $request_id always;
    # Membalas 503 dengan body JSON langsung dari nginx. Teks ini harus sama dengan kode galat yang dibaca frontend.
    return 503 '{"error":{"code":"AUTH_UNAVAILABLE","message":"login is temporarily unavailable"}}';
}

# [PENTING] Halaman buat password baru (tautan dari email membawa ?token=). Token tidak boleh bocor lewat tiga
# jalur: log akses (log JSON qms_json tidak mencatat query string), Referer (no-referrer), dan cache (no-store).
# add_header di location menggantikan yang di server{}, jadi header umum diulang di sini.
location = /reset-password {
    # Melarang browser menebak tipe konten, sama seperti di server{} (diulang karena add_header di location menggantikannya).
    add_header X-Content-Type-Options nosniff always;
    # Halaman ini tidak mengirim Referer ke sumber luar, sehingga token di URL tidak bocor.
    add_header Referrer-Policy no-referrer always;
    # Diulang karena add_header di location ini menggantikan yang di server{}.
    add_header X-Request-Id $request_id always;
    # Melarang cache: halaman yang berisi token tidak boleh disimpan browser atau proxy.
    add_header Cache-Control "no-store" always;
    # Meneruskan ke frontend (halaman web), bukan backend, karena ini halaman aplikasi.
    proxy_pass $qms_frontend;
    # Menyisipkan header WebSocket hanya di dev (frontend-upgrade.conf), kosong di prod.
    include /etc/nginx/snippets/frontend-upgrade.conf;
}

# [PENTING] Layar publik (tanpa login; token acak di path). SSE tanpa buffer, sama seperti event antrian.
location ~ ^/api/v1/display/[A-Za-z0-9_-]+/event$ {
    # [SESUAIKAN] Zona display_zone (20 r/s per IP). burst=40: lonjakan 40 diizinkan, karena beberapa layar bisa
    # berbagi satu IP. nodelay: langsung dilayani.
    limit_req zone=display_zone burst=40 nodelay;
    # Meneruskan request ke backend.
    proxy_pass $qms_backend;
    # Mengosongkan Connection agar koneksi ke backend tetap terbuka.
    proxy_set_header Connection "";
    # Diulang karena proxy_set_header di location ini menggantikan yang di server{}: backend tetap menerima ID request.
    proxy_set_header X-Request-Id $request_id;
    # Mematikan buffer agar setiap perubahan layar sampai seketika.
    proxy_buffering off;
    # Mematikan cache untuk stream event.
    proxy_cache off;
    # Mengirim respons dalam bentuk chunked, cara streaming SSE yang benar.
    chunked_transfer_encoding on;
    # 86400s = 24 jam. Batas menunggu data dari backend untuk koneksi SSE yang panjang.
    proxy_read_timeout 86400s;
    # 86400s = 24 jam. Batas mengirim data ke backend.
    proxy_send_timeout 86400s;
}

# [PENTING] Data layar publik (snapshot JSON). Token di path, disamarkan di log JSON global (qms_json) lewat $uri_masked.
location ~ ^/api/v1/display/[A-Za-z0-9_-]+$ {
    # [SESUAIKAN] Zona display_zone (20 r/s per IP) dengan burst 40, sama dengan endpoint event layar.
    limit_req zone=display_zone burst=40 nodelay;
    # Meneruskan request ke backend.
    proxy_pass $qms_backend;
}

# [PENTING] Halaman layar di browser. Sama seperti /reset-password: tanpa Referer, tanpa cache, token disamarkan di log.
location ~ ^/display/[A-Za-z0-9_-]+$ {
    # Melarang browser menebak tipe konten.
    add_header X-Content-Type-Options nosniff always;
    # Halaman layar tidak mengirim Referer ke sumber luar, sehingga token di URL tidak bocor.
    add_header Referrer-Policy no-referrer always;
    # Diulang karena add_header di location ini menggantikan yang di server{}.
    add_header X-Request-Id $request_id always;
    # Melarang cache halaman layar.
    add_header Cache-Control "no-store" always;
    # Meneruskan ke frontend (halaman web).
    proxy_pass $qms_frontend;
    # Menyisipkan header WebSocket hanya di dev, kosong di prod.
    include /etc/nginx/snippets/frontend-upgrade.conf;
}

# Webhook BorderPay: publik (dipanggil server BorderPay), diverifikasi dengan x-borderpay-token di payment-service.
# Dicocokkan persis (=). Path /internal/ (checkout) tetap diblokir nginx di atas.
location = /api/v1/webhooks/borderpay {
    proxy_pass $qms_payment;
    # Bila payment-service mati atau tidak terjangkau (502, 503, 504), balas JSON 503 lewat @payment_unavailable.
    # Status tetap non-2xx supaya BorderPay mengirim ulang webhook setelah service pulih.
    error_page 502 503 504 = @payment_unavailable;
}

# Dipakai bila payment-service mati atau tidak terjangkau. Balasannya JSON dengan kode PAYMENT_UNAVAILABLE, sama dengan
# kode yang dipakai backend saat checkout gagal. Hanya untuk webhook BorderPay: 503 (bukan 2xx) membuat BorderPay
# mencoba mengirim ulang, sehingga pembayaran yang lunas selama service mati tetap diterapkan nanti.
location @payment_unavailable {
    # Menetapkan Content-Type respons ke JSON.
    default_type application/json;
    # Memberi tahu pengirim untuk mencoba lagi setelah 30 detik. always: header tetap ada pada respons error.
    add_header Retry-After 30 always;
    # Diulang karena add_header di location ini menggantikan yang di server{}.
    add_header X-Request-Id $request_id always;
    return 503 '{"error":{"code":"PAYMENT_UNAVAILABLE","message":"payment service is temporarily unavailable"}}';
}

# [SESUAIKAN] Join lewat kode antrian (kode 6 karakter dari QR) dibatasi per IP. Regex menerima /api/v1/join dan /api/v1/join/preview.
location ~ ^/api/v1/join(/preview)?$ {
    # [SESUAIKAN] Zona join_zone (10 r/s per IP). burst=20 dan nodelay seperti zona login.
    limit_req zone=join_zone burst=20 nodelay;
    # Meneruskan request ke backend.
    proxy_pass $qms_backend;
}

# [SESUAIKAN] Foto profil. Unggahan sampai 5 MB (backend juga membatasi dan mengolah ulang). Lokasi ini dicocokkan
# persis (=), jadi hanya path ini yang mendapat batas body lebih besar.
location = /api/v1/users/me/avatar {
    # [SESUAIKAN] Batas body 6 MB untuk lokasi ini saja. Sedikit di atas 5 MB agar batas backend yang membalas,
    # bukan 413 dari nginx.
    client_max_body_size 6m;
    # [SESUAIKAN] Zona avatar_zone (5 r/s per IP). burst=10 dan nodelay.
    limit_req zone=avatar_zone burst=10 nodelay;
    # Meneruskan request ke backend.
    proxy_pass $qms_backend;
}

# Liveness backend lewat nginx. Dipakai healthcheck eksternal (mis. uptime monitor). Lokasi dicocokkan persis (=).
location = /health {
    # Pemeriksaan rutin tidak dicatat di log akses agar log tidak penuh.
    access_log off;
    # Meneruskan ke backend, yang menjawab liveness-nya.
    proxy_pass $qms_backend;
}

# Backend API untuk semua path /api/ yang belum punya location khusus di atas.
location /api/ {
    # Meneruskan request ke backend.
    proxy_pass $qms_backend;
    # 60 detik menunggu respons backend. SSE tidak lewat sini karena sudah punya blok sendiri.
    proxy_read_timeout 60s;
}

# Aplikasi frontend (paling bawah, menjadi fallback semua path lain).
location / {
    # Meneruskan semua path yang tidak cocok di atas ke frontend.
    proxy_pass $qms_frontend;
    # Menyisipkan header WebSocket untuk HMR Metro hanya di dev (kosong di prod).
    include /etc/nginx/snippets/frontend-upgrade.conf;
}
