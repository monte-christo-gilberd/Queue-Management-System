# Isi server{} bersama untuk HTTP (nginx.conf) dan HTTPS (https.conf).
client_max_body_size 1m;

# Upstream lewat variabel + resolver Docker: alamat kontainer di-resolve ulang,
# jadi restart/rebuild backend atau frontend tidak membuat nginx 502 terus.
resolver 127.0.0.11 valid=5s ipv6=off;
set $qms_backend http://backend:8080;
set $qms_frontend http://frontend:80;

# Header proxy umum
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Endpoint internal qr-service tidak boleh dijangkau dari luar (defense in depth).
location /internal/ {
    return 404;
}

# SSE: diteruskan tanpa buffer dan dengan timeout panjang agar event Next/Skip
# sampai ke customer seketika. Lokasi regex diperiksa lebih dulu daripada prefix.
location ~ ^/api/v1/queues/[0-9]+/event$ {
    proxy_pass $qms_backend;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Login dan register dibatasi lajunya.
location ~ ^/api/v1/users/(login|register)$ {
    limit_req zone=auth_zone burst=20 nodelay;
    proxy_pass $qms_backend;
}

# Join lewat token QR dibatasi lajunya.
location ~ ^/api/v1/join(/preview)?$ {
    limit_req zone=join_zone burst=20 nodelay;
    proxy_pass $qms_backend;
}

# Liveness backend lewat nginx (healthcheck eksternal).
location = /health {
    access_log off;
    proxy_pass $qms_backend;
}

# Backend API
location /api/ {
    proxy_pass $qms_backend;
    proxy_read_timeout 60s;
}

# Frontend App (paling bawah). Header WebSocket untuk HMR Metro hanya di dev:
# lihat frontend-dev.conf (di-include nginx.conf), tidak ada di produksi.
location / {
    proxy_pass $qms_frontend;
    include /etc/nginx/snippets/frontend-upgrade.conf;
}
