# Isi server{} bersama untuk HTTP (nginx.conf) dan HTTPS (https.conf).
client_max_body_size 1m;

# Upstream lewat variabel + resolver Docker: alamat kontainer di-resolve ulang,
# jadi restart/rebuild backend atau frontend tidak membuat nginx 502 terus.
resolver 127.0.0.11 valid=5s ipv6=off;
set $qms_backend http://backend:8080;
set $qms_frontend http://frontend:80;
# payment-service TERPISAH dari jalur antrian: bila mati, hanya /api/v1/payments/ yang gagal (JSON 503 di bawah);
# antrian, login, dan SSE tidak terpengaruh. Variabel + resolver juga membuat nginx tetap start tanpa payment-service.
set $qms_payment http://payment-service:8093;

# Header proxy umum
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

# Endpoint internal qr-service tidak boleh dijangkau dari luar (defense in depth).
location /internal/ {
    return 404;
}

# SSE: diteruskan tanpa buffer dan dengan timeout panjang agar event Next/Skip
# sampai ke customer seketika. Lokasi regex diperiksa lebih dulu daripada prefix.
location ~ ^/api/v1/queues/[0-9]+/event$ {
    proxy_pass $qms_backend;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

# Login dan register dibatasi lajunya.
location ~ ^/api/v1/users/(login|register)$ {
    limit_req zone=auth_zone burst=20 nodelay;
    proxy_pass $qms_backend;
}

# Lupa dan reset password: laju ketat per IP (batas per akun ada di backend).
location ~ ^/api/v1/users/(forgot-password|reset-password)$ {
    limit_req zone=reset_zone burst=5 nodelay;
    proxy_pass $qms_backend;
}

# Halaman buat password baru (tautan dari email membawa ?token=). Token tidak boleh bocor lewat log akses
# (format tanpa query) maupun header Referer saat halaman memuat sumber luar. add_header di location menggantikan
# yang di server{}, jadi header umum diulang di sini.
location = /reset-password {
    access_log /dev/stdout qms_masked;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    proxy_pass $qms_frontend;
    include /etc/nginx/snippets/frontend-upgrade.conf;
}

# Layar publik (tanpa login; token acak di path). Log memakai format yang menyamarkan token. SSE tanpa buffer.
location ~ ^/api/v1/display/[A-Za-z0-9_-]+/event$ {
    access_log /dev/stdout qms_masked;
    limit_req zone=display_zone burst=40 nodelay;
    proxy_pass $qms_backend;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_cache off;
    chunked_transfer_encoding on;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
}

location ~ ^/api/v1/display/[A-Za-z0-9_-]+$ {
    access_log /dev/stdout qms_masked;
    limit_req zone=display_zone burst=40 nodelay;
    proxy_pass $qms_backend;
}

# Halaman layar: tanpa Referer (token tidak bocor ke sumber luar) dan tanpa cache. add_header di location
# menggantikan yang di server{}, jadi header umum diulang.
location ~ ^/display/[A-Za-z0-9_-]+$ {
    access_log /dev/stdout qms_masked;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    proxy_pass $qms_frontend;
    include /etc/nginx/snippets/frontend-upgrade.conf;
}

# Join lewat token QR dibatasi lajunya.
location ~ ^/api/v1/join(/preview)?$ {
    limit_req zone=join_zone burst=20 nodelay;
    proxy_pass $qms_backend;
}

# Foto profil: unggahan sampai 5 MB (backend juga membatasi dan mengolah ulang), jadi batas body dinaikkan
# hanya di sini; seluruh API lain tetap 1m. Laju dibatasi per IP.
location = /api/v1/users/me/avatar {
    client_max_body_size 6m;
    limit_req zone=avatar_zone burst=10 nodelay;
    proxy_pass $qms_backend;
}

# Pembayaran langganan (payment-service). Webhook Stripe dari server Stripe: tanpa pembatasan laju (tanda tangan
# diverifikasi di service), body dibatasi 1m seperti API lain.
location = /api/v1/payments/webhooks/stripe {
    proxy_pass $qms_payment;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    error_page 502 503 504 = @payment_unavailable;
}

location /api/v1/payments/ {
    limit_req zone=payment_zone burst=5 nodelay;
    proxy_pass $qms_payment;
    proxy_connect_timeout 3s;
    proxy_read_timeout 20s;
    error_page 502 503 504 = @payment_unavailable;
}

# payment-service mati/tak terjangkau: balas JSON dengan kontrak galat yang sama dengan backend.
location @payment_unavailable {
    default_type application/json;
    add_header Retry-After 30 always;
    return 503 '{"error":{"code":"PAYMENT_UNAVAILABLE","message":"payments are temporarily unavailable"}}';
}

# Liveness backend lewat nginx (healthcheck eksternal).
location = /health {
    access_log off;
    proxy_pass $qms_backend;
}

# Backend API
location /api/ {
    proxy_pass $qms_backend;
    proxy_read_timeout 60s;
}

# Frontend App (paling bawah). Header WebSocket untuk HMR Metro hanya di dev:
# lihat frontend-dev.conf (di-include nginx.conf), tidak ada di produksi.
location / {
    proxy_pass $qms_frontend;
    include /etc/nginx/snippets/frontend-upgrade.conf;
}
