# Tahap 2 (HTTPS): pasang setelah sertifikat dari certbot tersedia.
# Ganti QMS_DOMAIN dan QMS_FRONTEND_DIR (lihat README.md di folder ini).

upstream qms_backend {
    server 127.0.0.1:8080;
    keepalive 16;
}

upstream qr_service {
    server 127.0.0.1:8090;
    keepalive 8;
}

# Batasi scan/render QR publik (20 r/s per IP, burst 40).
limit_req_zone $binary_remote_addr zone=qr_join:10m rate=20r/s;

# HTTP -> HTTPS, sekaligus jalur ACME untuk perpanjangan sertifikat.
server {
    listen 80;
    listen [::]:80;
    server_name QMS_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name QMS_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/QMS_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/QMS_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Endpoint internal qr-service tidak boleh dijangkau dari luar.
    location /internal/ {
        return 404;
    }

    # QR join dirender qr-service (cache header datang dari service).
    location /qr/ {
        limit_req zone=qr_join burst=40 nodelay;
        proxy_pass http://qr_service;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        proxy_read_timeout 30s;
    }

    # SSE: stream harus diteruskan segera, tanpa buffer. Ini sisi nginx dari
    # `X-Accel-Buffering: no` yang sudah dikirim backend. Ditaruh sebelum `/api/`
    # karena lokasi regex diperiksa lebih dulu daripada prefix biasa.
    location ~ ^/api/v1/queues/[0-9]+/event$ {
        proxy_pass http://qms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 1h;
    }

    # API biasa.
    location /api/ {
        proxy_pass http://qms_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Frontend statis.
    root QMS_FRONTEND_DIR;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
