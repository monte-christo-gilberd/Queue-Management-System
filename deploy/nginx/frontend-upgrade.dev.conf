# =============================================================================
# frontend-upgrade.dev.conf: header WebSocket untuk HMR Metro (HANYA DEV).
# -----------------------------------------------------------------------------
# Dipakai oleh : server.conf, lewat include /etc/nginx/snippets/frontend-upgrade.conf,
#                pada location / (frontend). Dipilih oleh build arg FRONTEND_UPGRADE
#                (nilai bawaan di Dockerfile, dan docker-compose.yml).
# Beda dengan  : frontend-upgrade.prod.conf, yang kosong. Produksi tidak butuh WebSocket.
# Bergantung pada: $connection_upgrade dari map di nginx.conf. Bila map itu diganti nama,
#                  berkas ini ikut diubah.
# Tujuan: Metro (server bundler Expo) memakai WebSocket untuk hot reload. Dua header
#         ini meneruskan permintaan upgrade ke frontend. Tanpa ini, hot reload gagal diam-diam.
# Jangan ubah tanpa memeriksa: berkas ini tidak boleh ikut ke produksi. Pastikan build
#                  produksi memakai frontend-upgrade.prod.conf.
# =============================================================================

# Meneruskan header Upgrade dari klien ke frontend. Ini yang membuat handshake WebSocket bisa berjalan.
proxy_set_header Upgrade $http_upgrade;
# Mengisi header Connection dengan nilai dari map ($connection_upgrade): "upgrade" saat klien minta upgrade,
# "close" bila tidak. Wajib dipasangkan dengan header Upgrade di atas.
proxy_set_header Connection $connection_upgrade;
